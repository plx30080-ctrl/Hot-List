name: Ping Supabase to Prevent Pausing
on:
  schedule:
    - cron: '0 9 * * 1,4'  # Runs Monday and Thursday at 9 AM UTC
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          node -e "
          const https = require('https');
          const url = new URL('/rest/v1/hot_list_entries?select=id&limit=1', process.env.SUPABASE_URL);
          const req = https.get(url, {
            headers: { 'apikey': process.env.SUPABASE_KEY }
          }, res => {
            console.log('Status:', res.statusCode);
            res.resume();
            res.on('end', () => console.log('Done'));
          });
          req.on('error', err => { console.error(err); process.exit(1); });
          req.end();
          "
